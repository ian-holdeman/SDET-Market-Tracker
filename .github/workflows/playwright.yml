name: Application baseline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 action runtime
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        id: dependencies
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run lint
      - name: Verify the normal production build
        run: npm run build
      - run: npm run build:e2e
      - run: npm run test:baseline
      - run: npm run test:e2e
        id: browser_tests
      - name: Validate sanitized evidence
        if: always() && steps.dependencies.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run test:e2e:ingest -- --github
      - name: Retain public-safe evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: test-evidence-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: .telemetry/publish/telemetry.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          archive: true
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run db:lint
      - run: npm run test:auth
      - run: npm run db:stop
        if: always()
