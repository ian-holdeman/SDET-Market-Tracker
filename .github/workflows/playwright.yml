name: Application baseline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run lint
      - run: npm run build:e2e
      - run: npm run test:baseline
      - run: npm run test:e2e
        id: browser_tests
      - name: Validate telemetry without publishing
        if: always() && (steps.browser_tests.outcome == 'success' || steps.browser_tests.outcome == 'failure')
        run: npm run test:e2e:ingest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
