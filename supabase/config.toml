# Local-only foundation. CLI version is pinned in package.json.
project_id = "sdet-market-tracker-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./fixtures/assets.sql", "./fixtures/users.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED)"

[realtime]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

# The npm CLI wrapper enables Google only when both ignored .env credentials exist.
[auth.external.google]
enabled = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED)"
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
